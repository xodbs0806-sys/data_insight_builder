<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보안 접속 - AI Data Insight Builder</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
            border: 1px solid var(--slate-200);
        }
        .login-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            background: var(--primary-light);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 8px;
        }
        .login-subtitle {
            font-size: 0.95rem;
            color: var(--slate-500);
            margin-bottom: 28px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 4px;
            border: 2px solid var(--slate-200);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--white);
            background: var(--primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .login-btn:hover {
            background: var(--primary-hover);
        }
        .login-error {
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .login-footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--slate-400);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-icon">🔒</div>
            <h1 class="login-title">AI Data Insight Builder</h1>
            <p class="login-subtitle">비밀번호를 입력하여 접속하세요</p>

            {% if error %}
            <div class="login-error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="login-form">
                <input 
                    type="password" 
                    name="password" 
                    class="login-input" 
                    placeholder="비밀번호 입력" 
                    autocomplete="current-password"
                    required 
                    autofocus
                >
                <button type="submit" class="login-btn">접속하기 ➔</button>
            </form>

            <div class="login-footer">
                공식기관 CSV 품질 진단 &amp; 신뢰성 검증 AI 분석기
            </div>
        </div>
    </div>
</body>
</html>
